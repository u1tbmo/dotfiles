# --- Typescript/JavaScript

[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { typescript = { tsdk = "~/.local/share/pnpm/store/v11/links/@/typescript/6.0.3/4c7d5dda06e5f9372ccbd4cadc34d29e5e1e0f616e2adf0b32c5b6b3f909eb4c/node_modules/typescript/lib" }, environment = "node" }

[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[language-server.emmet-lsp.config]
includeLanguages = {"astro" = "html"}

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]
config = { userLanguages = { astro = "html" } }

[language-server.oxc]
command = "oxlint"
args =  ["--lsp-server"]


[[language]]
name = "html"
language-servers = [ "vscode-html-language-server", "tailwindcss-ls" ]

[[language]]
name = "css"
language-servers = [ "vscode-css-language-server", "tailwindcss-ls" ]

[[language]]
name = "jsx"
language-servers = [ "oxc", "typescript-language-server", "tailwindcss-ls" ]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "dummy.ts"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = [ "oxc", "typescript-language-server", "tailwindcss-ls" ]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "dummy.ts"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "oxc", "typescript-language-server" ]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "dummy.ts"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = [ "oxc", "typescript-language-server" ]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "dummy.js"] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "dummy.json"] }

[[language]]
name = "astro"
scope = "source.astro"
injection-regex = "astro"
file-types = ["astro"]
roots = ["package.json", "astro.config.mjs"]
language-servers = ["astro-ls", "emmet-lsp", "tailwindcss-ls"]
auto-format = true

# --- Rust

[language-server.rust-analyzer.config]
checkOnSave = { command = "clippy" }
procMacro = { enable = true }
cargo = { loadOutDirsFromCheck = true }

[[language]]
name = "rust"
auto-format = true

# --- C

[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = ["--style=file"]}

# --- Python

[[language]]
name = "python"
language-servers = ["ruff"]
auto-format = true

[language-server.ruff]
command = "ruff"
args = ["server"]

# --- LaTeX

[[language]]
name = "latex"
language-servers = [ "texlab" , "ltex-ls-plus" ]

[language-server.ltex]
command = "ltex-ls-plus"

[language-server.ltex.config.ltex.dictionary]
"en-US" = ["ewwe","flaberrasted"]

[language-server.texlab]
command = "texlab"

[language-server.texlab.config.texlab.build]
onSave = true
forwardSearchAfter = true
 executable = "latexmk"
 args = [
  "-pdf",
  "-interaction=nonstopmode",
  "-synctex=1",
  "-shell-escape",
  "%f"
  ]

[language-server.texlab.config.texlab.forwardSearch]
executable = "zathura"
args = [ "--synctex-forward", "%l:%c:%f", "%p" ]

[language-server.texlab.config.texlab.chktex]
onOpenAndSave = true
onEdit = true

